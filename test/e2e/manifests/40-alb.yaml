# Ingress status.loadBalancer is set by the test through the status subresource.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-busy
spec:
  replicas: 1
  selector: {matchLabels: {app: alb-busy}}
  template:
    metadata: {labels: {app: alb-busy}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: alb-busy
spec:
  selector: {app: alb-busy}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: alb-busy}
spec:
  ingressClassName: alb
  rules:
    - host: alb-busy.e2e.test
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: alb-busy, port: {number: 80}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-idle
spec:
  replicas: 1
  selector: {matchLabels: {app: alb-idle}}
  template:
    metadata: {labels: {app: alb-idle}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: alb-idle
spec:
  selector: {app: alb-idle}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: alb-idle}
spec:
  ingressClassName: alb
  rules:
    - host: alb-idle.e2e.test
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: alb-idle, port: {number: 80}}}}
