apiVersion: v1
kind: Namespace
metadata: {name: spike}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: whoami, namespace: spike}
spec:
  replicas: 1
  selector: {matchLabels: {app: whoami}}
  template:
    metadata: {labels: {app: whoami}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: whoami, namespace: spike}
spec:
  selector: {app: whoami}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: whoami, namespace: spike}
spec:
  ingressClassName: traefik
  rules:
    - host: ingress.spike.test
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
