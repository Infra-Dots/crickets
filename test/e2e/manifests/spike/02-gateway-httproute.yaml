# Listener port is Traefik's container port for entrypoint "web" (8000), not 80.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: spike-gw, namespace: spike}
spec:
  gatewayClassName: traefik
  listeners:
    - {name: web, port: 8000, protocol: HTTP, allowedRoutes: {namespaces: {from: Same}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: whoami-route, namespace: spike}
spec:
  parentRefs: [{name: spike-gw}]
  hostnames: [route.spike.test]
  rules:
    - backendRefs: [{name: whoami, port: 80}]
