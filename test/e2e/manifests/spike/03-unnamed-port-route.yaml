apiVersion: v1
kind: Service
metadata: {name: plain, namespace: spike}
spec:
  selector: {app: whoami}
  ports: [{port: 8081, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: plain-route, namespace: spike}
spec:
  parentRefs: [{name: spike-gw}]
  hostnames: [plain.spike.test]
  rules:
    - backendRefs: [{name: plain, port: 8081}]
