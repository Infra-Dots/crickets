# Traefik Ingress scenarios. Names must not prefix each other (Traefik service regex).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy-ing
spec:
  replicas: 1
  selector: {matchLabels: {app: busy-ing}}
  template:
    metadata: {labels: {app: busy-ing}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: busy-ing
spec:
  selector: {app: busy-ing}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: busy-ing}
spec:
  ingressClassName: traefik
  rules:
    - host: busy-ing.e2e.test
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: busy-ing, port: {number: 80}}}}
