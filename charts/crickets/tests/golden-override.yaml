apiVersion: v1
kind: ConfigMap
metadata:
  name: crickets-idle-finder
  labels:
    helm.sh/chart: crickets-0.1.0
    app.kubernetes.io/name: idle-finder
    app.kubernetes.io/instance: crickets
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    dryRun: false
    label: example.com/idle
    minAge: 24h
    namespaces:
      exclude: []
      include:
      - apps
      - staging
    prometheus:
      bearerTokenFile: /var/run/secrets/prom/token
      timeout: 10s
      url: https://prom.example.com
    providers:
    - health: up{job="custom"}
      match:
        ingressClasses:
        - custom
        kinds:
        - Ingress
      name: custom
      query: sum(increase(custom_requests_total{ns="{{.Namespace}}"}[{{.Window}}]))
      supported: true
    selector: team=web
    threshold: 5
    window: 72h

