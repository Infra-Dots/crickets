name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test lint

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: charts/crickets/tests/check.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      # Via the Go module proxy: GitHub release downloads 504'd on two runs in a row.
      - name: Install k3d
        run: go install github.com/k3d-io/k3d/v5@v5.9.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make e2e-up e2e
      - if: failure()
        run: kubectl --kubeconfig .e2e/kubeconfig get pods -A
      - if: always()
        run: make e2e-down
